name: adapa
description: ADAPA offline-first language learning app.
publish_to: 'none'
version: 0.14.0+14

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_tts: 4.2.5
  audioplayers: 6.8.1
  unorm_dart: 0.3.2
  shared_preferences: 2.5.5
  google_mobile_ads: ^5.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
